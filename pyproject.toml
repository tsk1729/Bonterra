[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "community-udaan-assistance"
version = "0.1.0"
description = "Organization-isolated emergency funding tools over FastMCP stdio"
requires-python = ">=3.11,<3.15"
dependencies = ["fastmcp==4.0.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==0.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistance = ["database_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
